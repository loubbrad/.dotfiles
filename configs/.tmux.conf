set -g default-terminal "tmux-256color"
set -g prefix C-b
set -g prefix2 C-n
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",*256col*:RGB"

set -s set-clipboard on
set -g mouse on
set -g history-limit 10000
set -g base-index 1
set -g renumber-windows on
set -s escape-time 0

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind b last-window
bind n last-window
bind ( switch-client -p
bind ) switch-client -n

set -g status-bg "#000000"
set -g status-fg colour137
set -g status-right-length 50
set -g status-left-length 20
set -g status-left '#[fg=#abdfa7,bg=default]S#[fg=colour237,bg=default]:#[fg=colour250,bg=default]#{s|\$||:#{session_id}} '
set -g status-right '#[fg=colour250,bg=default] #H #[fg=colour250,bg=default] %d/%m #[fg=colour250,bg=default] %H:%M:%S '

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
